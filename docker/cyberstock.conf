# 赛博多人股市 - Apache 站点配置参考片段 (非 Docker 场景手工部署时使用)
# 说明: Docker 部署无需此文件 (Dockerfile 已内置等效配置)。
# 注意: AllowOverride 仅允许出现在本文件(服务器主配置)中, 绝不可写进 .htaccess (会导致全站 500)。
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    AddDefaultCharset UTF-8

    # 安全加固: 禁止下载敏感文件 (SQL 结构含密码哈希, mcp_kurumi.py 含默认口令)
    <FilesMatch "\.(sql|py|md|sh|log|bak|ini|env|lock|json)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
